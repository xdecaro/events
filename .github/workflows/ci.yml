name: Events CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', coverage: none}
      - name: PHP syntax
        run: find component package tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: XML and metadata
        run: python3 build/validate.py
      - name: Smoke
        run: php tests/core-integration-smoke.php
      - name: Deterministic build A
        run: python3 build/build.py && cp dist/SHA256SUMS.txt /tmp/sums
      - name: ZIP integrity
        run: for f in dist/*.zip; do unzip -t "$f" >/dev/null; done
      - name: Deterministic build B
        run: python3 build/build.py && diff -u /tmp/sums dist/SHA256SUMS.txt

  joomla-runtime:
    name: Joomla ${{ matrix.joomla }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5.4.8', '6.1.3']
        mode: ['clean', 'repair-1.1.1', 'missing-core']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, simplexml
          coverage: none
      - name: Build Events package
        run: python3 build/build.py
      - name: Download verified dependencies
        shell: bash
        run: |
          set -euo pipefail
          JOOMLA='${{ matrix.joomla }}'
          case "$JOOMLA" in
            5.4.8) JSHA='8d3585939bca8e6b1d5f3e97dda2cc557c61e610daf488c871e1f62a97be9bd0' ;;
            6.1.3) JSHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1' ;;
            *) exit 1 ;;
          esac
          JFILE="Joomla_${JOOMLA}-Stable-Full_Package.zip"
          curl -fL --retry 3 "https://github.com/joomla/joomla-cms/releases/download/${JOOMLA}/${JFILE}" -o /tmp/joomla.zip
          echo "${JSHA}  /tmp/joomla.zip" | sha256sum --check --strict
          curl -fL --retry 3 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' -o /tmp/core.zip
          echo '4248f7e3de514c2ae2402ffc8ba12845647dca1ebac963da370650e88ac45def  /tmp/core.zip' | sha256sum --check --strict
          if [ '${{ matrix.mode }}' = 'repair-1.1.1' ]; then
            curl -fL --retry 3 'https://github.com/xdecaro/events/releases/download/v1.1.1/pkg_decaroevents_1.1.1.zip' -o /tmp/events-old.zip
            echo 'fff2229d4189f1b870fc8a8bf636e94e894726ae14ceb080b5f5dcd36af9433e  /tmp/events-old.zip' | sha256sum --check --strict
          fi
          mkdir joomla && unzip -q /tmp/joomla.zip -d joomla
      - name: Install Joomla
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install --site-name='Events CI' --admin-user='Events CI Admin' --admin-username=admin --admin-password="EventsCI-${GITHUB_RUN_ID}!" --admin-email=admin@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=joomla --db-prefix=evt_ --db-encryption=0 --no-interaction
      - name: Install Core when required
        if: matrix.mode != 'missing-core'
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php cli/joomla.php extension:install --path=/tmp/core.zip -vvv
      - name: Verify mandatory Core rejection
        if: matrix.mode == 'missing-core'
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          set +e
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_decaroevents_${VERSION}.zip" -vvv >/tmp/events-without-core.log 2>&1
          STATUS=$?
          set -e
          echo "events_without_core_status=${STATUS}"
          cat /tmp/events-without-core.log
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          package_count="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM evt_extensions WHERE type='package' AND element='pkg_decaroevents';")"
          component_count="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM evt_extensions WHERE type='component' AND element='com_decaroevents';")"
          echo "package_count=${package_count} component_count=${component_count}"
          test "$package_count" = '0'
          test "$component_count" = '0'
          test ! -d administrator/components/com_decaroevents
          test ! -e administrator/manifests/packages/decaroevents.xml
      - name: Install or repair Events
        if: matrix.mode != 'missing-core'
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          if [ '${{ matrix.mode }}' = 'repair-1.1.1' ]; then
            php cli/joomla.php extension:install --path=/tmp/events-old.zip -vvv
            BEFORE="$(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='evt_decaroevents_events';")"
            echo "events_table_before_repair=${BEFORE}"
          fi
          VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_decaroevents_${VERSION}.zip" -vvv
      - name: Verify Events schema
        if: matrix.mode != 'missing-core'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          for table in evt_decaroevents_events evt_decaroevents_sessions evt_decaroevents_registrations; do
            count="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='${table}';")"
            echo "${table}=${count}"
            test "$count" = '1'
          done
          schema="$("${MYSQL[@]}" -e "SELECT s.version_id FROM evt_schemas s JOIN evt_extensions e ON e.extension_id=s.extension_id WHERE e.type='component' AND e.element='com_decaroevents' LIMIT 1;")"
          echo "events_schema=${schema}"
          test "$schema" = "$VERSION"
