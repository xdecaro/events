name: Events Release
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - component/**
      - package/**
      - build/**
      - tests/**
      - .github/workflows/release.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Read version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release exists"
            exit 1
          fi
      - name: Validate
        run: |
          find component package tests -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 build/validate.py
          python3 tests/admin-ui-contract.py
          python3 tests/joomla6-only-contract.py
          php tests/core-integration-smoke.php
      - name: Build
        run: python3 build/build.py
      - name: Synchronize checksum
        run: python3 build/update_feed_checksum.py
      - name: Verify
        run: |
          SHA="$(sha256sum dist/pkg_decaroevents_${VERSION}.zip | awk '{print $1}')"
          grep -q "<sha256>${SHA}</sha256>" updates/pkg_decaroevents.xml
          unzip -t "dist/pkg_decaroevents_${VERSION}.zip" >/dev/null
          unzip -p "dist/com_decaroevents_${VERSION}.zip" decaroevents.xml | grep -F 'charset="utf8"'
          unzip -l "dist/com_decaroevents_${VERSION}.zip" | grep -F "admin/sql/updates/mysql/${VERSION}.sql"
          unzip -p "dist/com_decaroevents_${VERSION}.zip" site/src/Service/EventDescriptionSanitizer.php | grep -F 'ONLY_ALLOW_DEFINED_TAGS'
          unzip -p "dist/com_decaroevents_${VERSION}.zip" admin/sql/install.mysql.utf8mb4.sql | grep -F 'idx_event_session_email'
          unzip -p "dist/pkg_decaroevents_${VERSION}.zip" script.php | grep -F 'final class pkg_decaroeventsInstallerScript'
          unzip -p "dist/pkg_decaroevents_${VERSION}.zip" script.php | grep -F "MINIMUM_JOOMLA = '6.1.3'"
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "dist/com_decaroevents_${VERSION}.zip" \
            "dist/pkg_decaroevents_${VERSION}.zip" \
            dist/SHA256SUMS.txt \
            --title "Events by xdecaro ${VERSION}" \
            --notes "Events ${VERSION}: fixes session-scoped duplicate registration handling and safely renders rich event descriptions through a Joomla InputFilter allowlist. Joomla 6.1.3+ and PHP 8.3+ remain required; capacity, waitlist, check-in, dashboard and Core/Editor integration are unchanged."
      - name: Publish feed checksum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_decaroevents.xml
          git diff --cached --quiet || git commit -m "Publish SHA-256 for Events ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
