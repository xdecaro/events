name: Bootstrap Events 1.0.0

on:
  push:
    branches: [main]
    paths:
      - bootstrap_events.py
      - .github/workflows/bootstrap-events.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Expand source tree
        run: python3 bootstrap_events.py
      - name: PHP syntax
        run: find component package tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: XML and metadata
        run: python3 build/validate.py
      - name: Core integration smoke test
        run: php tests/core-integration-smoke.php
      - name: Deterministic build A
        run: python3 build/build.py && cp dist/SHA256SUMS.txt /tmp/events-sums
      - name: Deterministic build B
        run: python3 build/build.py && diff -u /tmp/events-sums dist/SHA256SUMS.txt
      - name: ZIP integrity
        run: for f in dist/*.zip; do unzip -t "$f" >/dev/null; done
      - name: Synchronize update checksum
        run: python3 build/update_feed_checksum.py
      - name: Verify package checksum
        run: |
          SHA="$(sha256sum dist/pkg_decaroevents_1.0.0.zip | awk '{print $1}')"
          grep -q "<sha256>${SHA}</sha256>" updates/pkg_decaroevents.xml
          grep -q "${SHA}  pkg_decaroevents_1.0.0.zip" dist/SHA256SUMS.txt
      - name: Publish complete source atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f bootstrap_events.py .github/workflows/bootstrap-events.yml
          git add -A
          git commit -m "Publish Events 1.0.0 Core-first baseline"
          git push origin HEAD:main
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 dist/com_decaroevents_1.0.0.zip dist/pkg_decaroevents_1.0.0.zip dist/SHA256SUMS.txt \
            --title "Events by xdecaro 1.0.0" \
            --notes "First stable Core-first Events release: events, sessions, capacity, registrations, waitlist and check-in."
